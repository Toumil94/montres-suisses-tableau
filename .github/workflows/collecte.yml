name: Collecte des données

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 3 * *"   # le 3 de chaque mois

permissions:
  contents: write

jobs:
  collecte:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt matplotlib
      - name: Télécharger (UN Comtrade, BNS)
        timeout-minutes: 35   # au-delà, on publie ce qui a été collecté et la suite reprend au prochain lancement
        run: python pipeline/fetch.py
      - name: Construire les tables
        id: build
        run: python pipeline/build.py
      - name: Contrôles qualité
        run: python -m pytest -q tests
      - name: Chiffres de référence et graphiques
        run: python pipeline/analyse.py
      - name: Régénérer le classeur Tableau
        run: |
          pip install lxml
          python tableau/build_twb.py
          python tableau/check_twb.py
      - name: Publier
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw
          if [ "${{ job.status }}" = "success" ]; then git add data tableau analyse docs/images; fi
          git diff --cached --quiet || git commit -m "Données mises à jour ($(date +%Y-%m-%d))"
          git push
