name: Exemples Tableau (exploration)
on:
  push:
    branches: [exploration]
permissions:
  contents: write
jobs:
  telecharger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Télécharger des classeurs récents de Tableau Public
        run: |
          mkdir -p exemples
          python3 - <<'P'
          import json, urllib.request, urllib.parse, zipfile, io, re, pathlib
          H = {"User-Agent": "Mozilla/5.0"}
          def get(u):
              return urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=60).read()
          out = pathlib.Path("exemples"); n = 0; log = []
          repos = []
          for prof in ["kevin.flerlage", "ken.flerlage", "tableau.public", "lindsay.betzendahl", "zach.bowders", "sam.parsons", "chimdi.nwosu", "nicole.klassen", "andy.kriebel", "eva.murray"]:
              u = f"https://public.tableau.com/profile/api/{prof}/workbooks?count=20&index=0"
              try:
                  js = json.loads(get(u))
              except Exception as e:
                  log.append(f"profil {prof}: {e}"); continue
              items = js if isinstance(js, list) else js.get("contents", js.get("workbooks", []))
              log.append(f"profil {prof}: {len(items)}")
              for w in items:
                  if w.get("workbookRepoUrl"):
                      repos.append((w.get("lastPublishDate", 0), w["workbookRepoUrl"]))
          repos = sorted(set(repos), reverse=True)
          log.append(f"{len(repos)} classeurs trouvés")
          for _, repo in repos[:40]:
              if n >= 6:
                  break
              try:
                  data = get(f"https://public.tableau.com/workbooks/{repo}.twb")
              except Exception as e:
                  log.append(f"{repo}: {e}"); continue
              names = []
              try:
                  z = zipfile.ZipFile(io.BytesIO(data))
                  names = z.namelist()
                  xml = z.read([f for f in names if f.endswith(".twb")][0])
              except zipfile.BadZipFile:
                  xml = data
              head = xml[:800].decode("utf-8", "ignore")
              build = re.search(r"source-build='([^']+)'", head)
              b = build.group(1) if build else "?"
              if not b.startswith("2026"):
                  log.append(f"{repo}: {b} ignoré"); continue
              (out / f"{repo}.twb").write_bytes(xml)
              (out / f"{repo}.files.txt").write_text("\n".join(names))
              n += 1; log.append(f"{repo}: {b} OK")
          (out / "journal.txt").write_text("\n".join(log))
          print("::notice title=Exemples::" + " | ".join(log[:40]))
          P
      - name: Recherche de code GitHub
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh search code "source-build='2026" --extension twb --limit 20 --json repository,path > exemples/github.json || true
          echo "::notice title=GitHub::$(head -c 1500 exemples/github.json)"
      - name: Publier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exemples && git commit -m "exemples" && git push
